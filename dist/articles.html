<h1>Articles</h1>
<p class="lede">Plain-English guides to gold signals, precious metals, commodity benchmarks and cross-asset ratios. Each article explains its formula, context and limitations.</p>
<div class="artlist" id="artlist"><p class="note">Loading articles…</p></div>
<footer>GoldAlert · Educational use only</footer>
</main>
<script>
fetch("articles/articles.json",{cache:"no-store"}).then(r=>r.json()).then(list=>{
  list.sort((a,b)=> (b.date||"").localeCompare(a.date||""));
  document.getElementById("artlist").innerHTML = list.map(a=>`
    <a class="art card" href="${a.url}">
      <div class="cat">${a.category||"Article"}</div>
      <h2>${a.title}</h2>
      <p>${a.excerpt||""}</p>
      <div class="date">${a.date||""}</div>
    </a>`).join("") || '<p class="note">No articles published yet.</p>';
}).catch(()=>{
  document.getElementById("artlist").innerHTML = '<p class="note">Could not load the article list right now.</p>';
});
</script>
</body></html>
