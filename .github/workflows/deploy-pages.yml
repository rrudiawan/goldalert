name: Deploy GitHub Pages

# Publishes the contents of dist/ to GitHub Pages.
#
# Setup (one-time):
#   1. Repo Settings -> Pages -> Source: select "GitHub Actions".
#   2. Actions tab -> "Deploy GitHub Pages" -> Run workflow (to publish for the first time).
#      After that it deploys automatically on every push to main that touches dist/.

on:
  push:
    branches: [main]
    paths:
      - "dist/**"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check internal site links
        run: node scripts/check-site-links.mjs

      - name: Upload dist/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
